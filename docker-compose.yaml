
services:
  # Qdrant vector DB
  qdrant:
    image: qdrant/qdrant:latest
    container_name: Siemens_Qdrant
    restart: always
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage   # <-- use defined named volume

  # MongoDB for document storage
  mongodb:
    image: mongo:8.0
    container_name: Siemens_MongoDB
    restart: always
    ports:
      - "27020:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  qdrant_storage:
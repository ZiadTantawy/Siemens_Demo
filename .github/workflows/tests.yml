# Automated Testing with GitHub Actions (Optional)

name: RAG System Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: "0 2 * * *"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27020:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -f http://localhost:6333/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "API_KEY=${{ secrets.API_KEY }}" > .env
          echo "CHAT_MODEL=${{ secrets.CHAT_MODEL }}" >> .env
          echo "EMBED_MODEL=${{ secrets.EMBED_MODEL }}" >> .env
          echo "QDRANT_HOST=localhost" >> .env
          echo "QDRANT_PORT=6333" >> .env
          echo "MONGODB_HOST=localhost" >> .env
          echo "MONGODB_PORT=27020" >> .env

      - name: Wait for services
        run: |
          sleep 10
          curl -f http://localhost:6333/health || exit 1

      - name: Ingest test documents
        run: |
          python backend/ingest_pdfs_qdrant.py
        continue-on-error: true

      - name: Run quick validation
        run: |
          python tests/quick_test.py

      - name: Run accuracy tests
        run: |
          python tests/test_accuracy.py
        continue-on-error: true

      - name: Run performance tests
        run: |
          python tests/test_performance.py
        continue-on-error: true

      - name: Run comprehensive tests
        run: |
          python tests/run_comprehensive_tests.py --output-dir test_reports

      - name: Upload test reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-reports
          path: test_reports/
          retention-days: 30

      - name: Generate visualizations
        run: |
          python tests/visualize_results.py --reports-dir test_reports
        continue-on-error: true

      - name: Upload visualizations
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-visualizations
          path: test_reports/*.png
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('test_reports/comprehensive_report.json', 'utf8'));

            const summary = report.summary;
            const comment = `## 🧪 Test Results

            ### Summary
            - ✅ Accuracy Tests: ${summary.accuracy_passed ? 'PASSED' : 'FAILED'}
            - ✅ Web Fallback Tests: ${summary.web_fallback_passed ? 'PASSED' : 'FAILED'}
            - ✅ Performance Tests: ${summary.performance_passed ? 'PASSED' : 'FAILED'}

            ### Accuracy Metrics
            ${summary.overall_accuracy ? `
            - Retrieval Success Rate: ${(summary.overall_accuracy.retrieval_success_rate * 100).toFixed(1)}%
            - Response Success Rate: ${(summary.overall_accuracy.response_success_rate * 100).toFixed(1)}%
            - Hallucination Rate: ${(summary.overall_accuracy.hallucination_rate * 100).toFixed(1)}%
            ` : 'N/A'}

            ### Performance Metrics
            ${summary.overall_performance ? `
            - Mean Response Time: ${summary.overall_performance.mean_response_time.toFixed(2)}s
            - Throughput: ${summary.overall_performance.throughput.toFixed(2)} req/s
            - Sustained Success Rate: ${(summary.overall_performance.sustained_load_success_rate * 100).toFixed(1)}%
            ` : 'N/A'}

            📊 Full reports available in artifacts.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
